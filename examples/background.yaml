# Optional tasks only start when their matching extensions are enabled in TOML.
# All provider credentials are environment variables; examples contain no real endpoints.
identity:
  ai_name: AI
  user_name: User
  user_display_name: 用户
scene_linker:
  enabled: true
  auto_enabled: true
  models:
    - name: configured-relations
      model: your-model
      base_url: https://models.example/v1
      api_key_env: LATTICE_SCENE_LINKER_API_KEY
dream:
  enabled: true
  auto_enabled: true
  model: your-model
  base_url: https://models.example/v1
  timezone: UTC
  # Set LATTICE_DREAM_API_KEY in the host environment.
narrative_rolls:
  revision_scan_enabled: true
  revision_scan_timezone: Asia/Shanghai
  revision_scan_hour: 4
  revision_scan_minute: 0
