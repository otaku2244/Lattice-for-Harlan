services:
  memory:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LATTICE_HTTP_TOKEN_FILE: /secrets/api-token
      LATTICE_MIGRATION_PATH_ROOT: /legacy/input
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./secrets:/secrets:ro
      - ./runtime:/data
      - ${LATTICE_LEGACY_SOURCE:-./runtime/legacy-input}:/legacy/input:ro
      - ../src/lattice/resources:/usr/local/lib/python3.13/site-packages/lattice/resources:ro
      - ../src/lattice/recall/index.py:/usr/local/lib/python3.13/site-packages/lattice/recall/index.py:ro
      - ../src/lattice/recall/vectors.py:/usr/local/lib/python3.13/site-packages/lattice/recall/vectors.py:ro
      - ../src/lattice/recall/passages.py:/usr/local/lib/python3.13/site-packages/lattice/recall/passages.py:ro
      - ../src/lattice/recall/entities.py:/usr/local/lib/python3.13/site-packages/lattice/recall/entities.py:ro
      - ../src/lattice/extensions/pipeline.py:/usr/local/lib/python3.13/site-packages/lattice/extensions/pipeline.py:ro
      - ../src/lattice/extensions/pipeline_latest.py:/usr/local/lib/python3.13/site-packages/lattice/extensions/pipeline_latest.py:ro
      - ../src/lattice/core/store.py:/usr/local/lib/python3.13/site-packages/lattice/core/store.py:ro
    entrypoint: ["python", "-m", "lattice.launch"]
    command: ["--config", "/config/config.toml", "http", "--live", "--host", "0.0.0.0", "--port", "8011"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [lattice]
  gateway:
    build:
      context: ..
      dockerfile: deploy/Gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      memory:
        condition: service_healthy
    environment:
      LATTICE_MEMORY_URL: http://memory:8011
      LATTICE_MEMORY_TOKEN_FILE: /secrets/api-token
      LATTICE_WEB_AUTH_FILE: /secrets/web-auth.json
      LATTICE_INSTALL_ROOT: ${LATTICE_INSTALL_ROOT:-}
      LATTICE_LEGACY_SOURCE_HOST: ${LATTICE_LEGACY_SOURCE_HOST:-}
      LATTICE_LEGACY_SOURCE_CONFIGURED: ${LATTICE_LEGACY_SOURCE_CONFIGURED:-0}
      LATTICE_PUBLIC_ORIGIN: ${LATTICE_PUBLIC_ORIGIN:-}
      LATTICE_WRITER_DEBUG_DIR: /writer-debug
    ports:
      - "${LATTICE_BIND:-127.0.0.1}:${LATTICE_PORT:-18217}:8080"
    volumes:
      - ./secrets:/secrets:ro
      - ./runtime/writer-debug:/writer-debug
      - ./web/server:/app/server:ro
    networks: [lattice]
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:8080/ready'); if (!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  lattice:
